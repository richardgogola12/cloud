name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Verzia
        id: ver
        run: |
          MAJOR=$(grep '^MAJOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          MINOR=$(grep '^MINOR=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          CODE=${{ github.run_number }}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$MAJOR.$MINOR.$CODE" >> "$GITHUB_OUTPUT"
          echo "Verzia $MAJOR.$MINOR.$CODE (versionCode $CODE)"

      - name: Podpisový kľúč z GitHub Secrets (voliteľné)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Použijem kľúč zo Secrets"
          else
            echo "Použijem kľúč z repozitára (android/keystore)"
          fi

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ steps.ver.outputs.code }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/cloud-android-${{ steps.ver.outputs.code }}.apk
          cp app/build/outputs/apk/release/app-release.apk ../dist/cloud-android.apk
          ls -la ../dist

      - name: Artefakt
        uses: actions/upload-artifact@v6
        with:
          name: cloud-android-${{ steps.ver.outputs.name }}
          path: dist/cloud-android-${{ steps.ver.outputs.code }}.apk

      - name: Vydanie (GitHub Release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: android-v${{ steps.ver.outputs.name }}
          name: Android ${{ steps.ver.outputs.name }}
          body: |
            ${{ github.event.head_commit.message || 'Nová verzia Android aplikácie' }}

            Inštalácia: stiahni `cloud-android.apk` a otvor ho v telefóne. Nainštalovaná aplikácia sa aktualizuje sama.
          make_latest: true
          files: |
            dist/cloud-android-${{ steps.ver.outputs.code }}.apk
            dist/cloud-android.apk
